<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="Style.css">
</head>
<body>
    <form>
    <fieldset>
        <legend>Think Mart</legend>
        <h1>Sign-Up Form</h1>

      <label for="First Name">First Name:</label>
      <input required maxlength="10" minlength="3" type="text" id="fname" name="Enter First Name">
       <br><br>

      <label for="Last Name">Last Name:</label>
      <input required maxlength="10" minlength="3" type="text" id="lname" name="Enter Last Name">
        <br><br>

      <label for="email">Email:</label>
      <input required type="email" id="Email" name="Email">
      <br><br>

      <label for="phn">Phone No:</label>
      <input required maxlength="10" minlength="10" type="tel" id="Phn" pattern="[6-9]{1}[0-9]{9}" placeholder="+91" name="phn">
      <br><br>
        
      <label for="psw">Password:</label>
        <input required minlength="6" maxlength="8" type="password" id="psw" placeholder="Create new password">
        <br><br>

        <label for="cpsw">Confirm Password:</label>
        <input required minlength="6" maxlength="8" type="password" id="cpsw" placeholder="Confirm new password">
        <br><br>

        <label for="dob">Date Of Birth:</label>
        <input required type="date" id="dob">
        <br><br>

        <label for="gender">Gender:</label>
        <input type="radio" name="gender" value="male"> <span>Male</span>
        <input type="radio" name="gender" value="female"> <span>Female</span>
        <input type="radio" name="gender" value="other"> <span>Other</span>
        <br><br>

        <label for="state">State:</label>
        <select name="state" id="state">
            <option value="NA">Select State</option>
            <option value="Andhra Pradesh">AP</option>
            <option value="Arunachal Pradesh">ARP</option>
            <option value="Assam">AS</option>
            <option value="Bihar">BR</option>
            <option value="Chhattisgarh">CG</option>
            <option value="Goa">GA</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Haryana">Haryana</option>
            <option value="Himachal Pradesh">HP</option>
            <option value="Jharkhand">Jharkhand</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Kerala">Kerala</option>
            <option value="Madhya Pradesh">Madhya Pradesh</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Manipur">Manipur</option>
            <option value="Meghalaya">Meghalaya</option>
            <option value="Mizoram">Mizoram</option>
            <option value="Nagaland">Nagaland</option>
            <option value="Odisha">Odisha</option>
            <option value="Punjab">Punjab</option>
            <option value="Rajasthan">Rajasthan</option>
            <option value="Sikkim">Sikkim</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Telangana">Telangana</option>
            <option value="Tripura">Tripura</option>
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="Uttarakhand">Uttarakhand</option>
            <option value="West Bengal">West Bengal</option>
        </select>
        <br><br>

        <labelfor="city">City:</label>
        <input type="text" id="city" name="city">
        <br><br>

        <label for="address">Address:</label>
        <textarea id="" name="" rows="2" cols="30" placeholder="Enter your address"></textarea>
        <br><br>

        <label for="role">Role:</label>
        <input type="radio" name="role" value="Admin"> <span>Admin</span>
        <input type="radio" name="role" value="Vender"> <span>Vender</span>
        <input type="radio" name="role" value="Customer"> <span>Customer</span>
        <br><br>

        <label for="profile_pic">Profile Picture:</label>
        <input type="file" accept=".png .jpeg .jpg">
        <br><br>

        <button type="submit">Register</button>
        <button type="reset">Cancel</button>
    </fieldset>
    </form>
        
</body>
</html>
