<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Think Mart</legend>
            <h1>Sign-In</h1>
            <label style="font-weight: bold;color: red;" for="Username">Username:</label>
            <input type="text" id="Username" name="Username">

            <br><br>
            <label style="font-weight: bold;color: red;" for="password">Password:</label>
            <input type="password" minlength="6" id="password" name="password">

            <br><br>
            <button type="submit">Login</button>
            <button type="cancel">Cancel</button>
        </fieldset>
    </form>
</body>
</html>
